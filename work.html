<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none, max-video-preview:0">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, max-snippet:0, max-image-preview:none, max-video-preview:0">
  <meta name="googlebot-news" content="noindex, nosnippet">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="AdsBot-Google" content="noindex">
  <meta name="format-detection" content="telephone=no, email=no, address=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Ganaël Chevallier · Work</title>
  <link rel="icon"             href="favicon.ico" type="image/x-icon">
  <link rel="icon"             href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <meta name="theme-color"    content="#080808">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Syne:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ─── VARIABLES ──────────────────────────────────────── */
    :root {
      --black:    #080808;
      --ink:      #111111;
      --charcoal: #1C1C1C;
      --smoke:    #2E2E2E;
      --silver:   #9A9A9A;
      --offwhite: #E8E4DC;
      --cream:    #F5F0E8;
      --gold:     #B8983A;
      --gold-lt:  #D4AF50;
      --mist:     #717171;
    }

    /* ─── RESET ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--black);
      color: var(--offwhite);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      overflow-x: hidden;
      cursor: default;
    }

    ::selection { background: var(--gold); color: var(--black); }

    /* ─── GRAIN OVERLAY ──────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 500;
      opacity: 0.35;
    }

    /* ─── PAGE TRANSITION ────────────────────────────────────── */
    #page-content { animation: pageFadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both; }
    @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ─── VIEW TRANSITIONS (Chrome 126+) ────────────────────── */
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 350ms ease-in     both vt-fade-out; }
    ::view-transition-new(root) { animation: 500ms cubic-bezier(0.25, 0.46, 0.45, 0.94) both vt-fade-in; }
    @keyframes vt-fade-out { to   { opacity: 0; } }
    @keyframes vt-fade-in  { from { opacity: 0; } }

    /* ─── WRAPPER ────────────────────────────────────────── */
    .site-wrap {
      max-width: 1600px;
      margin: 0 auto;
      background: var(--black);
      min-height: 100vh;
    }

    html { background-color: #080808; scroll-behavior: smooth; scroll-padding-top: 48px; overflow-x: hidden; overflow-y: scroll; scrollbar-gutter: stable; }

    /* ─── NAV ────────────────────────────────────────────── */
    /* ── NAV, clamp() continu, indépendant des breakpoints de page ── */
    nav {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 890px;
      height: 48px;
      z-index: 600;
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-around;
      align-items: center;
      padding: 0 clamp(2px, 3.86vw - 10.35px, 24px);
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--charcoal);
      overflow: hidden;
    }

    .nav-link {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(8.5px, 0.44vw + 7.1px, 11px);
      letter-spacing: clamp(0.8px, 0.535vw - 0.91px, 3.85px);
      text-transform: uppercase;
      color: var(--offwhite);
      text-decoration: none;
      padding: 0 clamp(3px, 2.28vw - 4.3px, 16px);
      height: 100%;
      display: flex;
      align-items: center;
      transition: color 0.25s;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
    }

    .nav-link:hover  { color: var(--gold-lt); }
    .nav-link.active { color: var(--gold); }
    .nav-link--xp { font-size: clamp(10.5px, 0.44vw + 9.1px, 13px); }
    /* pas de règles nav dans les @media, le clamp() suffit */

    /* ─── PAGE HEADER ────────────────────────────────────── */
    .page-header {
      padding: 80px 0 60px;
      background: var(--black);
    }

    .page-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 300;
      color: var(--cream);
      line-height: 1;
      letter-spacing: 0.01em;
      max-width: 668px;
      margin: 0 auto;
      text-align: left;
      padding: 0 24px;
    }

    /* ─── VIDEO GRID ─────────────────────────────────────── */
    .videos-section {
      padding: 1px;
      padding-bottom: 60px;
      background: var(--black);
    }

    .videos-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1px;
      background: var(--black);
      max-width: 668px;
      margin: 0 auto;
    }

    /* ─── CARD ───────────────────────────────────────────── */
    .video-card {
      position: relative;
      cursor: pointer;
      overflow: hidden;
      background: var(--black);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      overflow: hidden;
      background: #111;
    }

    .thumb-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.5s ease, filter 0.4s, opacity 0.3s;
      filter: brightness(0.88) saturate(0.85);
    }

    .video-card:hover .thumb-wrap img {
      transform: scale(1.05);
      filter: brightness(0.45) saturate(0.6);
    }

    .video-card.playing .thumb-wrap img { opacity: 0; pointer-events: none; }

    /* ─── PLAY OVERLAY ───────────────────────────────────── */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 2;
    }

    .video-card:hover .play-overlay { opacity: 1; }
    .video-card.playing .play-overlay { display: none; }

    .play-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: rgba(8,8,8,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: transform 0.2s, background 0.2s;
    }

    .video-card:hover .play-btn {
      transform: scale(1.1);
      background: rgba(184,152,58,0.2);
    }

    .play-btn svg { margin-left: 3px; }

    /* ─── IFRAME WRAP ────────────────────────────────────── */
    .iframe-wrap {
      position: absolute;
      inset: 0;
      display: none;
      z-index: 1;
    }

    .video-card.playing .iframe-wrap { display: block; }

    .iframe-wrap > div,
    .iframe-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* ─── CARD CONTROLS ──────────────────────────────────── */
    .card-controls {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .video-card.playing .card-controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Lecture → Pause visible, Play caché */
    .card-controls .ctrl-play  { display: none; }
    .card-controls .ctrl-pause { display: flex; }
    /* Pause → Play visible, Pause caché */
    .card-controls.paused .ctrl-pause { display: none; }
    .card-controls.paused .ctrl-play  { display: flex; }

    /* Capte les mouvements souris par-dessus l'iframe */
    .mouse-catcher {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      cursor: default;
    }
    .video-card.playing .mouse-catcher { display: block; }

    .ctrl-btn {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
      background: rgba(8,8,8,0.7);
      color: var(--offwhite);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: transform 0.2s, background 0.2s;
      flex-shrink: 0;
      padding: 0;
    }

    .ctrl-btn:hover {
      transform: scale(1.1);
      background: rgba(184,152,58,0.2);
    }

    .ctrl-btn svg { display: block; }

    /* ─── GOLD BOTTOM LINE ON HOVER ──────────────────────── */
    .video-card:not(.playing)::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.4s ease;
      z-index: 3;
    }

    .video-card:not(.playing):hover::after { transform: scaleX(1); }

    /* ─── RESPONSIVE ─────────────────────────────────────── */
    @media (max-width: 890px)  {
      /* nav : aucune règle ici, géré via clamp() dans les styles de base */
      .videos-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px)  {
      /* nav : aucune règle ici, géré via clamp() dans les styles de base */
      .videos-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ─── FOOTER ─────────────────────────────────────────── */
    footer {
      background: var(--black);
      padding: 40px 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 1px solid var(--charcoal);
      max-width: 890px;
      margin: 0 auto;
      width: 100%;
    }
    .footer-top {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .footer-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--mist);
      white-space: nowrap;
    }
    .footer-copy {
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--smoke);
      white-space: nowrap;
    }
    .footer-dot {
      color: var(--charcoal);
      font-size: 10px;
      text-decoration: none;
      transition: color 0.4s;
      user-select: none;
      cursor: default;
    }
    .footer-dot:hover { color: var(--mist); cursor: pointer; }

    /* ─── FOOTER RESPONSIVE ─────────────────────────────────── */
    @media (max-width: 890px) {
      footer              { flex-direction: column; gap: 12px; text-align: center; padding: 32px 20px 20px; }
      .footer-top         { flex-direction: column; gap: 8px; text-align: center; }
      .footer-copy        { font-size: 8px; }
    }

    /* ─── ACCESSIBILITÉ : prefers-reduced-motion ─────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      #page-content { opacity: 1 !important; animation: none !important; }
    }
  </style>
  <script src="tracker.js" defer></script>
  <noscript><style>#page-content { opacity: 1; }</style></noscript>

<body>
<div class="site-wrap">

  <!-- ─── NAV ────────────────────────────────────────────── -->
<nav>
  <a href="index.html"         class="nav-link">Home</a>
  <a href="reels.html"   class="nav-link">Reels</a>
  <a href="Experience.html"    class="nav-link nav-link--xp">XP</a>
  <a href="work.html"          class="nav-link active">Work</a>
  <a href="index.html#contact" class="nav-link">Contact</a>
</nav>

<div id="page-content">

  <!-- ─── PAGE HEADER ─────────────────────────────────────── -->
  <div class="page-header">
    <h1 class="page-title">Work</h1>
  </div>

  <!-- ─── VIDEO GRID ──────────────────────────────────────── -->
  <section class="videos-section">
    <div class="videos-grid" id="grid"></div>
  </section>

<!-- VIDÉOS : la liste est dans videos.js (à modifier avec videos-editor) -->
<script src="videos.js"></script>
<script>
  // ─── Chargement API YouTube IFrame ──────────────────────────
  (function () {
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(s);
  })();

  var ytReady = false;
  var ytQueue = [];
  window.onYouTubeIframeAPIReady = function () {
    ytReady = true;
    ytQueue.forEach(fn => fn());
    ytQueue = [];
  };

  // ─── Données : la liste est dans videos.js (partagée avec la page XP) ───
  const V = (window.VIDEOS || []).filter(v => v.work !== false && !v.hidden).map(v => v.id);

  // ─── Constantes ─────────────────────────────────────────────
  const HIDE_DELAY = 600; // ms avant masquage automatique des contrôles
  const thumb      = id => `https://img.youtube.com/vi/${id}/mqdefault.jpg`;

  // ─── État global ────────────────────────────────────────────
  let activeCard = null;
  const cardState = new WeakMap(); // { player, hideTimer }

  // ─── Fermer une carte ────────────────────────────────────────
  function closeCard(card) {
    const s = cardState.get(card);
    clearTimeout(s.hideTimer);
    if (s.player) { try { s.player.destroy(); } catch (e) {} s.player = null; }
    card.querySelector('.iframe-wrap').innerHTML    = '';
    card.querySelector('.card-controls').classList.remove('visible', 'paused');
    card.classList.remove('playing');
    if (activeCard === card) activeCard = null;
  }

  // ─── Construction de la grille ──────────────────────────────
  const grid = document.getElementById('grid');

  V.forEach(id => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
      <div class="thumb-wrap">
        <img src="${thumb(id)}" alt="" loading="lazy" decoding="async" width="320" height="180">
        <div class="play-overlay">
          <div class="play-btn">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M3 2l9 5-9 5V2z" fill="var(--gold)"/>
            </svg>
          </div>
        </div>
        <div class="iframe-wrap"></div>
        <div class="mouse-catcher"></div>
        <div class="card-controls">
          <button class="ctrl-btn ctrl-play" title="Play">
            <svg width="24" height="24" viewBox="0 0 10 10" fill="currentColor" style="margin-left:2px">
              <path d="M2 1.5l7 3.5-7 3.5V1.5z"/>
            </svg>
          </button>
          <button class="ctrl-btn ctrl-pause" title="Pause">
            <svg width="24" height="24" viewBox="0 0 10 10" fill="currentColor">
              <rect x="1.5" y="1.5" width="2.5" height="7" rx="0.5"/>
              <rect x="6"   y="1.5" width="2.5" height="7" rx="0.5"/>
            </svg>
          </button>
        </div>
      </div>`;

    const state     = { player: null, hideTimer: null };
    cardState.set(card, state);

    const controls  = card.querySelector('.card-controls');
    const btnPlay   = card.querySelector('.ctrl-play');
    const btnPause  = card.querySelector('.ctrl-pause');
    const catcher   = card.querySelector('.mouse-catcher');
    const iframeWrap = card.querySelector('.iframe-wrap');

    const isTouch = () => window.matchMedia('(hover: none)').matches;

    // ── Afficher brièvement les contrôles puis masquer ──────────
    function showControls() {
      controls.classList.add('visible');
      clearTimeout(state.hideTimer);
      state.hideTimer = setTimeout(() => controls.classList.remove('visible'), HIDE_DELAY);
    }

    // ── Mise à jour état lecture / pause + auto-masquage ────────
    function setPlaying(playing) {
      controls.classList.toggle('paused', !playing);
      showControls();
    }

    // ── Démarrer la lecture ─────────────────────────────────────
    function openCard() {
      if (activeCard && activeCard !== card) closeCard(activeCard);
      card.classList.add('playing');
      activeCard = card;

      const init = () => {
        const div = document.createElement('div');
        iframeWrap.appendChild(div);
        state.player = new YT.Player(div, {
          videoId: id,
          playerVars: { autoplay: 1, rel: 0 },
          events: {
            onReady:       e => { e.target.playVideo(); setPlaying(true); },
            onStateChange: e => {
              if (e.data === YT.PlayerState.PLAYING) setPlaying(true);
              if (e.data === YT.PlayerState.PAUSED)  setPlaying(false);
            }
          }
        });
      };

      if (ytReady) init(); else ytQueue.push(init);
    }

    // ── Clic sur la vignette → démarrer ─────────────────────────
    card.addEventListener('click', () => {
      if (!card.classList.contains('playing')) openCard();
    });

    // ── Desktop : mouvement souris → afficher contrôles ─────────
    catcher.addEventListener('mousemove', () => {
      if (!isTouch()) showControls();
    });

    // ── Clic / tap sur la vidéo → basculer play / pause ─────────
    catcher.addEventListener('click', e => {
      e.stopPropagation();
      if (!state.player) return;
      const playerState = state.player.getPlayerState();
      if (playerState === YT.PlayerState.PLAYING) {
        state.player.pauseVideo();
        setPlaying(false);
      } else {
        state.player.playVideo();
        setPlaying(true);
      }
    });

    // ── Mobile : touchend → même bascule (évite le double-fire avec click) ──
    catcher.addEventListener('touchend', e => {
      e.preventDefault();
      if (!state.player) return;
      const playerState = state.player.getPlayerState();
      if (playerState === YT.PlayerState.PLAYING) {
        state.player.pauseVideo();
        setPlaying(false);
      } else {
        state.player.playVideo();
        setPlaying(true);
      }
    });

    // ── Bouton Play ──────────────────────────────────────────────
    btnPlay.addEventListener('click', e => {
      e.stopPropagation();
      if (state.player) state.player.playVideo();
      setPlaying(true);
    });

    // ── Bouton Pause ─────────────────────────────────────────────
    btnPause.addEventListener('click', e => {
      e.stopPropagation();
      if (state.player) state.player.pauseVideo();
      setPlaying(false);
    });

    grid.appendChild(card);
  });

  // ─── Fade-out du contenu au clic sur un lien de nav ───────
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      if (!href || href.startsWith('#')) return;
      e.preventDefault();
      // View Transitions CSS gère le fondu nativement sur Chrome 126+
      if (CSS.supports('view-transition-name', 'none') &&
          document.createElement('span').style.viewTransitionName !== undefined) {
        window.location.href = href;
        return;
      }
      // Fallback JS
      const content = document.getElementById('page-content');
      content.style.transition = 'opacity 0.35s ease';
      content.style.opacity = '0';
      setTimeout(() => { window.location.href = href; }, 350);
    });
  });

</script>

</div><!-- /#page-content -->

<footer>
  <div class="footer-top">
    <span class="footer-name">Ganaël Chevallier</span>
    <span class="footer-copy">© 2026 · Layout 3D · Prévisualisation · Animation CG · Île-de-France · Paris</span>
  </div>
  <a href="stats.html" class="footer-dot" title="" tabindex="-1" aria-hidden="true">·</a>
</footer>

</div><!-- /.site-wrap -->

</body>
