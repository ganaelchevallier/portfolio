  <meta name="theme-color" content="#080808">
  <title>Ganaël Chevallier · Reels</title>

  <link rel="icon"                href="favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:ital,wght@0,300;0,400;1,300&family=Syne:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ─── VARIABLES ──────────────────────────────────────────── */
    :root {
      --black:    #080808;
      --ink:      #111111;
      --charcoal: #1C1C1C;
      --smoke:    #2E2E2E;
      --mist:     #717171;
      --silver:   #9A9A9A;
      --offwhite: #E8E4DC;
      --cream:    #F5F0E8;
      --gold:     #B8983A;
      --gold-lt:  #D4AF50;
      --gold-dim: rgba(184,152,58,0.15);
      /* padding horizontal fluide : 16 px @600 → 48 px @890+ (élimine le saut) */
      --h-pad: clamp(16px, 11.03vw - 50.21px, 48px);
    }

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      background-color: #080808;
      scroll-behavior: smooth;
      scroll-padding-top: 48px;
      overflow-x: hidden;
      overflow-y: scroll;
      scrollbar-gutter: stable;
    }
    body {
      max-width: 890px;
      margin: 0 auto;
      background: var(--black);
      color: var(--offwhite);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      overflow-x: hidden;
      cursor: default;
    }
    ::selection { background: var(--gold); color: var(--black); }

    /* ─── PAGE TRANSITION ────────────────────────────────────── */
    #page-content {
      animation: pageFadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }
    @keyframes pageFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @view-transition { navigation: auto; }
    ::view-transition-old(root) { animation: 350ms ease-in both vt-fade-out; }
    ::view-transition-new(root) { animation: 500ms cubic-bezier(0.25,0.46,0.45,0.94) both vt-fade-in; }
    @keyframes vt-fade-out { to   { opacity: 0; } }
    @keyframes vt-fade-in  { from { opacity: 0; } }

    /* ─── GRAIN OVERLAY ──────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 500;
      opacity: 0.35;
    }

    /* ─── NAV ────────────────────────────────────────────────── */
    /* ── NAV — clamp() continu, indépendant des breakpoints de page ── */
    nav {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 890px;
      height: 48px;
      z-index: 600;
      display: flex;
      flex-wrap: nowrap;
      justify-content: space-around;
      align-items: center;
      padding: 0 clamp(2px, 3.86vw - 10.35px, 24px);
      background: rgba(8,8,8,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--charcoal);
      overflow: hidden;
    }
    .nav-link {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(8.5px, 0.44vw + 7.1px, 11px);
      letter-spacing: clamp(0.8px, 0.535vw - 0.91px, 3.85px);
      text-transform: uppercase;
      color: var(--offwhite);
      text-decoration: none;
      padding: 0 clamp(3px, 2.28vw - 4.3px, 16px);
      height: 100%;
      display: flex;
      align-items: center;
      transition: color 0.25s;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
    }
    .nav-link:hover  { color: var(--gold-lt); }
    .nav-link.active { color: var(--gold); }
    .nav-link--xp { font-size: clamp(10.5px, 0.44vw + 9.1px, 13px); }
    /* pas de règles nav dans les @media — le clamp() suffit */

    /* ─── PAGE HERO ──────────────────────────────────────────── */
    .page-hero {
      margin-top: 48px;
      padding: 20px var(--h-pad) 20px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .page-hero-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      animation: fadeUp 0.9s 0.3s ease forwards;
    }
    .page-hero-sub {
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--silver);
      white-space: nowrap;
    }

    /* ─── DIVIDER ────────────────────────────────────────────── */
    .divider {
      width: calc(100% - 2 * var(--h-pad));
      height: 1px;
      background: linear-gradient(to right, transparent, var(--charcoal) 20%, var(--charcoal) 80%, transparent);
      margin: 0 var(--h-pad);
    }

    /* ─── FILTER BAR ─────────────────────────────────────────── */
    .filter-bar {
      padding: clamp(24px, 5.52vw - 9.1px, 40px) var(--h-pad) 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 0.6s 0.7s ease forwards;
    }
    .filter-bar:empty { display: none; }
    .filter-row {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: clamp(4px, 0.69vw - 0.14px, 6px);
    }
    .filter-sep { display: none; }
    .filter-btn {
      font-family: 'DM Mono', monospace;
      font-size: clamp(8px, 0.455vw + 6.73px, 9px);
      font-weight: 300;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mist);
      background: transparent;
      border: 1px solid var(--charcoal);
      padding: 8px clamp(12px, 1.43vw + 7.42px, 16px);
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.25s, border-color 0.25s, background 0.25s;
    }
    .filter-row-years .filter-btn {
      padding: 8px clamp(14px, 2.14vw + 7.15px, 20px);
    }
    .filter-btn:hover  { color: var(--offwhite); border-color: var(--smoke); }
    .filter-btn.active { color: var(--gold); border-color: var(--gold-dim); background: var(--gold-dim); }

    /* ─── REELS MAIN AREA ────────────────────────────────────── */
    .reels-main {
      padding: clamp(40px, 5.52vw + 6.88px, 56px) var(--h-pad) 120px;
    }

    /* ─── GRID ───────────────────────────────────────────────── */
    .reels-page-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: clamp(56px, 5.52vw + 22.88px, 72px);
      max-width: 592px;   /* ≈ 890 × 2/3 — taille max réduite d'1/3 */
      margin: 0 auto;
    }

    /* ─── REEL CARD ──────────────────────────────────────────── */
    .reel-card {
      position: relative;
      background: var(--ink);
      border: 1px solid var(--charcoal);
      overflow: hidden;
      /* entrée staggered */
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.75s ease, transform 0.75s ease,
                  border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .reel-card.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reel-card:hover {
      border-color: rgba(184,152,58,0.45);
      box-shadow: 0 12px 48px rgba(0,0,0,0.4), 0 0 0 0px var(--gold-dim);
    }
    /* accent gauche au hover */
    .reel-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--gold);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94);
      z-index: 1;
    }
    .reel-card:hover::before { transform: scaleY(1); }

    /* numéro de séquence */
    .reel-index {
      position: absolute;
      top: 16px;
      right: 20px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--gold);
      opacity: 0.45;
      z-index: 2;
      user-select: none;
    }

    /* ─── VIDEO EMBED ────────────────────────────────────────── */
    .reel-video-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%;   /* 16:9 */
      background: var(--smoke);
      overflow: hidden;
      border-bottom: 1px solid var(--smoke);
    }
    .reel-video-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    /* skeleton shimmer — disparaît quand l'iframe a chargé */
    .reel-video-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        100deg,
        var(--charcoal) 0%,
        var(--smoke) 35%,
        var(--charcoal) 70%
      );
      background-size: 250% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
      transition: opacity 0.5s ease;
    }
    .reel-video-wrap.loaded::after { opacity: 0; pointer-events: none; }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Facade play button ──────────────────────────────────── */
    .reel-facade {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 2;
      background: var(--charcoal);
    }
    .reel-facade-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(184,152,58,0.18);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }
    .reel-facade:hover .reel-facade-btn {
      background: rgba(184,152,58,0.35);
      transform: scale(1.08);
    }
    .reel-facade-btn svg {
      margin-left: 4px; /* compense l'asymétrie du triangle */
    }
    .reel-video-wrap.loaded .reel-facade { display: none; }

    /* ─── REEL INFO ──────────────────────────────────────────── */
    .reel-info {
      padding: 12px 28px 12px 30px;  /* 30 compense l'accent 2px */
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 20px;
    }
    .reel-meta {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 14px;
      overflow: hidden;
    }
    .reel-category {
      font-size: 8px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .reel-title-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--cream);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: color 0.3s;
      min-width: 0;
    }
    .reel-card:hover .reel-title-text { color: var(--cream); }

    /* skeleton titre en cours de chargement */
    .reel-title-text.loading {
      color: transparent;
      background: linear-gradient(100deg, var(--charcoal) 25%, var(--smoke) 50%, var(--charcoal) 75%);
      background-size: 250% 100%;
      animation: shimmer 1.8s ease-in-out infinite;
      border-radius: 0;
      min-width: 200px;
      user-select: none;
    }

    /* ─── CTA ────────────────────────────────────────────────── */
    .reel-cta {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
      padding: 11px 20px;
      border: 1px solid var(--gold-dim);
      flex-shrink: 0;
      transition: background 0.3s, border-color 0.3s, color 0.3s;
    }
    .reel-cta:hover {
      background: var(--gold-dim);
      border-color: var(--gold);
    }
    .reel-cta svg { transition: transform 0.25s ease; }
    .reel-cta:hover svg { transform: translateX(3px); }

    /* ─── EMPTY STATE ────────────────────────────────────────── */
    .reels-empty {
      text-align: center;
      padding: 100px 0;
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--mist);
    }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer {
      background: var(--black);
      padding: 40px var(--h-pad) 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-top: 1px solid var(--charcoal);
    }
    .footer-top {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .footer-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--mist);
      white-space: nowrap;
    }
    .footer-copy {
      font-size: 9px;
      letter-spacing: 0.15em;
      color: var(--smoke);
      white-space: nowrap;
      text-align: center;
    }
    .footer-dot {
      color: var(--charcoal);
      font-size: 10px;
      text-decoration: none;
      transition: color 0.4s;
      user-select: none;
      cursor: default;
    }
    .footer-dot:hover { color: var(--mist); cursor: pointer; }

    /* ─── ANIMATIONS ─────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ─── REDUCED MOTION ─────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .page-hero-meta,
      .filter-bar,
      #page-content { opacity: 1 !important; animation: none !important; }
      .reel-card { opacity: 1 !important; transform: none !important; }
    }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 890px) {
      /* nav, filter-bar, reels-main top padding, grid gap : clamp() dans les bases */
      .reels-main { padding-bottom: 80px; }
      .reel-info  { padding: 20px 20px 22px 22px; flex-wrap: wrap; gap: 12px; }
      footer      { flex-direction: column; gap: 12px; text-align: center; padding: 32px 20px 20px; }
      .footer-top { flex-direction: column; gap: 8px; text-align: center; }
      .footer-copy { font-size: 8px; }
    }

    @media (max-width: 600px) {
      /* nav, filter, hero-sub, reels-main top, grid gap : clamp() dans les bases */
      .reels-main { padding-bottom: 64px; }

      .reel-info  { padding: 16px 16px 18px; }
      .reel-title-text { font-size: 19px; }
      .reel-index { font-size: 10px; top: 12px; right: 14px; }

    }

    /* @media 380px supprimé : filter-btn padding et font-size gérés via clamp() dans les bases */
  </style>

  <script src="tracker.js" defer></script>
  <noscript>
    <style>
      .reel-card { opacity: 1 !important; transform: none !important; }
      .filter-bar, .page-hero-meta { opacity: 1 !important; }
    </style>
  </noscript>
</head>

/** Convertit toute URL videas.fr en URL embed propre */
function toEmbedUrl(url) {
  if (url.includes('/embed/media/')) {
    return url.endsWith('/') ? url : url + '/';
  }
  const m = url.match(/app\.videas\.fr\/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/i);
  return m ? `https://app.videas.fr/embed/media/${m[1]}/` : url;
}

/** Extrait l'UUID depuis une URL embed videas.fr */
function extractUUID(embedUrl) {
  const m = embedUrl.match(/\/media\/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/i);
  return m ? m[1] : null;
}

/** Construit l'URL de partage depuis l'UUID */
function toShareUrl(embedUrl) {
  const uuid = extractUUID(embedUrl);
  return uuid ? `https://app.videas.fr/${uuid}/` : embedUrl;
}

/** Formate l'index sur 2 chiffres : 1 → "01" */
const pad = n => String(n).padStart(2, '0');

/**
 * Tente de récupérer le titre OG d'une vidéo videas.fr via un proxy CORS.
 * Retourne null si indisponible ou erreur réseau.
 */
async function fetchVideoTitle(embedUrl) {
  const uuid = extractUUID(embedUrl);
  if (!uuid) return null;

  // Proxies CORS à essayer dans l'ordre (allorigins bloque Videas)
  const proxies = [
    u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];

  // URLs cibles : embed d'abord, puis page de partage
  const targets = [
    embedUrl,
    `https://app.videas.fr/${uuid}/`,
  ];

  for (const target of targets) {
    for (const buildProxy of proxies) {
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 6000);
        const res = await fetch(buildProxy(target), { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) continue;

        const html = await res.text();

        // 1. og:title
        let m = html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)
              || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i);
        if (m && m[1].trim()) return m[1].trim();

        // 2. <title> (ignorer les placeholders génériques "Videas")
        m = html.match(/<title[^>]*>\s*([^<]+?)\s*<\/title>/i);
        if (m) {
          const t = m[1].trim();
          if (t && !/^(videas|app\.videas\.fr)$/i.test(t)) return t;
        }
      } catch {
        // timeout ou CORS bloqué → proxy suivant
      }
    }
  }
  return null;
}


// ═══════════════════════════════════════════════════════════════════
//  RENDU D'UNE CARD
// ═══════════════════════════════════════════════════════════════════

function loadIframe(wrap, embedUrl, title) {
  const iframe = document.createElement('iframe');
  iframe.src = embedUrl;
  iframe.title = title || 'Démo Reel — Ganaël Chevallier';
  iframe.allowFullscreen = true;
  iframe.setAttribute('referrerpolicy', 'unsafe-url');
  iframe.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture');
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-popups allow-forms');
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;';
  iframe.addEventListener('load', () => wrap.classList.add('loaded'), { once: true });
  wrap.appendChild(iframe);
}

function createCard(reel, index) {
  const embedUrl = toEmbedUrl(reel.url);
  const shareUrl = toShareUrl(embedUrl);
  const hasTitle = !!reel.title;
  const cardTitle = reel.title || 'Démo Reel — Ganaël Chevallier';

  const article = document.createElement('article');
  article.className = 'reel-card';
  article.dataset.category = reel.category || '';
  article.dataset.type     = reel.type     || '';
  article.dataset.embedUrl = embedUrl;
  article.dataset.cardTitle = cardTitle;

  article.innerHTML = `
    <span class="reel-index" aria-hidden="true">${pad(index + 1)}</span>

    <div class="reel-video-wrap" id="vwrap-${index}">
      <div class="reel-facade" role="button" aria-label="Lancer la vidéo">
        <div class="reel-facade-btn">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
            <polygon points="8,5 19,11 8,17" fill="var(--gold)"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="reel-info">
      <div class="reel-meta">
        <p class="reel-category" id="cat-${index}">${reel.category || ''}</p>
        <p class="reel-title-text${hasTitle ? '' : ' loading'}" id="title-${index}">
          ${reel.title || '\u00a0'}
        </p>
      </div>
    </div>
  `;

  // Clic sur le bouton facade → charge l'iframe
  const wrap = article.querySelector('.reel-video-wrap');
  wrap.querySelector('.reel-facade').addEventListener('click', () => {
    loadIframe(wrap, embedUrl, cardTitle);
  }, { once: true });

  return article;
}


// ═══════════════════════════════════════════════════════════════════
//  FILTRE PAR CATÉGORIE
// ═══════════════════════════════════════════════════════════════════

function buildFilters(reels) {
  const bar = document.getElementById('filter-bar');

  // ── Années ──────────────────────────────────────────────────────
  const yearSet = new Set();
  reels.forEach(r => {
    if (r.category) {
      const m = r.category.match(/\b(20\d{2})\b/);
      if (m) yearSet.add(m[1]);
    }
  });
  const years = [...yearSet].sort().reverse();
  if (!years.length) return;

  let activeYear = years[0];

  function applyFilters() {
    document.querySelectorAll('.reel-card').forEach(card => {
      const matchYear = card.dataset.category && card.dataset.category.includes(activeYear);
      card.style.display = matchYear ? '' : 'none';
    });
  }

  // ── Boutons années ───────────────────────────────────────────────
  const rowYears = document.createElement('div');
  rowYears.className = 'filter-row filter-row-years';
  years.forEach((year, idx) => {
    const btn = document.createElement('button');
    btn.className = idx === 0 ? 'filter-btn active' : 'filter-btn';
    btn.textContent = year;
    btn.dataset.filterGroup = 'year';
    btn.setAttribute('aria-pressed', idx === 0 ? 'true' : 'false');
    rowYears.appendChild(btn);
  });
  bar.appendChild(rowYears);

  applyFilters();

  // ── Événements ───────────────────────────────────────────────────
  bar.addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;

    bar.querySelectorAll('.filter-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');

    activeYear = btn.textContent;
    applyFilters();
  });
}


// ═══════════════════════════════════════════════════════════════════
//  SCROLL REVEAL
// ═══════════════════════════════════════════════════════════════════

const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      revealObserver.unobserve(e.target);
    }
  });
}, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });


// ═══════════════════════════════════════════════════════════════════
//  NAVIGATION (fade out + view transitions)
// ═══════════════════════════════════════════════════════════════════

function initNavTransitions() {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      if (!href || href.startsWith('#')) return;
      e.preventDefault();
      // View Transitions API (Chrome 126+) gère le fondu nativement
      if (CSS.supports('view-transition-name', 'none') &&
          document.createElement('span').style.viewTransitionName !== undefined) {
        window.location.href = href;
        return;
      }
      // Fallback JS
      const content = document.getElementById('page-content');
      content.style.transition = 'opacity 0.35s ease';
      content.style.opacity = '0';
      setTimeout(() => { window.location.href = href; }, 350);
    });
  });
}


// ═══════════════════════════════════════════════════════════════════
//  PRÉCHARGEMENT SÉQUENTIEL DES IFRAMES
//  Charge les vidéos une par une dans l'ordre, en attendant que
//  chaque iframe soit prête avant de lancer la suivante.
//  Un timeout de secours de 12 s évite le blocage si l'événement
//  load ne se déclenche pas (réseau lent, player muet, etc.).
// ═══════════════════════════════════════════════════════════════════

function preloadSequential(cards, index) {
  if (index >= cards.length) return;

  const { card, reel } = cards[index];
  const wrap = card.querySelector('.reel-video-wrap');

  // Si l'utilisateur a déjà cliqué avant que le préchargement arrive ici
  if (wrap.querySelector('iframe')) {
    preloadSequential(cards, index + 1);
    return;
  }

  const embedUrl  = toEmbedUrl(reel.url);
  const cardTitle = reel.title || 'Démo Reel — Ganaël Chevallier';

  const iframe = document.createElement('iframe');
  iframe.src = embedUrl;
  iframe.title = cardTitle;
  iframe.allowFullscreen = true;
  iframe.setAttribute('referrerpolicy', 'unsafe-url');
  iframe.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture');
  iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-popups allow-forms');
  iframe.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;';

  // Timeout de secours : si l'iframe ne tire jamais "load" (ex. réseau lent),
  // on passe quand même à la suivante après 12 s.
  const fallback = setTimeout(() => preloadSequential(cards, index + 1), 12000);

  iframe.addEventListener('load', () => {
    wrap.classList.add('loaded'); // cache la facade via CSS
    clearTimeout(fallback);
    // Petit délai pour ne pas saturer la bande passante avant que le
    // player commence à bufferiser la vidéo qui vient de charger.
    setTimeout(() => preloadSequential(cards, index + 1), 400);
  }, { once: true });

  wrap.appendChild(iframe);
}


// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════

async function init() {
  const grid = document.getElementById('reels-grid');

  if (!REELS.length) {
    grid.innerHTML = '<p class="reels-empty">Aucun reel disponible pour le moment.</p>';
    initNavTransitions();
    return;
  }

  // ① Rendu immédiat de toutes les cards (titres en skeleton si absents)
  const cards = REELS.map((reel, i) => {
    const card = createCard(reel, i);
    // Décalage staggered : chaque card entre 100ms après la précédente
    card.style.transitionDelay = `${i * 0.1}s`;
    grid.appendChild(card);
    revealObserver.observe(card);
    return { card, reel, i };
  });

  // ① bis — Charge l'iframe de la 1ère vidéo automatiquement (sans attendre le clic)
  if (cards.length > 0) {
    const firstWrap = cards[0].card.querySelector('.reel-video-wrap');
    const firstEmbed = cards[0].reel;
    const embedUrl = toEmbedUrl(firstEmbed.url);
    const cardTitle = firstEmbed.title || 'Démo Reel — Ganaël Chevallier';
    loadIframe(firstWrap, embedUrl, cardTitle);
    const facade = firstWrap.querySelector('.reel-facade');
    if (facade) facade.style.display = 'none';

    // Préchargement séquentiel : vidéo 2, 3, 4… dans l'ordre.
    // On attend 1,5 s pour laisser la 1ère prendre la priorité réseau,
    // puis chaque iframe se charge dès que la précédente est prête.
    setTimeout(() => preloadSequential(cards, 1), 1500);
  }

  // ② Filtres années
  buildFilters(REELS);

  // ③ Transitions de navigation
  initNavTransitions();

  // ④ Récupération asynchrone des titres manquants
  const pending = cards.filter(({ reel }) => !reel.title);
  for (const { reel, i } of pending) {
    const embedUrl = toEmbedUrl(reel.url);
    // Fire-and-forget : pas de await global pour ne pas bloquer l'affichage
    fetchVideoTitle(embedUrl).then(title => {
      const titleEl  = document.getElementById(`title-${i}`);
      if (!titleEl) return;

      if (title) {
        titleEl.textContent = title;
      } else if (reel.category) {
        // Fallback : utiliser la catégorie comme titre (ex. "2025 · Stylized")
        titleEl.textContent = reel.category;
      } else {
        titleEl.textContent = 'Démo Reel';
      }
      titleEl.classList.remove('loading');
    });
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
